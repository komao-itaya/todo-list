<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ToDoリスト</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #222;
      --muted: #888;
      --accent: #2f6fdb;
      --border: #e2e4e8;
      --danger: #d64545;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1d21;
        --card: #26292e;
        --text: #eee;
        --muted: #999;
        --accent: #5b93f0;
        --border: #3a3e45;
        --danger: #f07070;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    }
    .app {
      max-width: 520px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 16px; font-size: 1.5rem; }

    /* 入力欄 */
    .add-form { display: flex; gap: 8px; }
    .add-form input {
      flex: 1;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: transparent;
      color: var(--text);
    }
    button {
      padding: 10px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }

    /* 絞り込みボタン */
    .filters { display: flex; gap: 6px; margin: 16px 0 8px; }
    .filters button {
      padding: 6px 12px;
      font-size: 0.9rem;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .filters button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* ToDo一覧 */
    ul { list-style: none; margin: 0; padding: 0; }
    li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid var(--border);
    }
    li input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
    li .title { flex: 1; word-break: break-all; }
    li.done .title { text-decoration: line-through; color: var(--muted); }
    li .delete {
      padding: 4px 10px;
      font-size: 0.85rem;
      background: transparent;
      color: var(--danger);
    }
    .empty { color: var(--muted); text-align: center; padding: 24px 0; }

    /* フッター */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .footer button {
      padding: 4px 10px;
      font-size: 0.85rem;
      background: transparent;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>ToDoリスト</h1>

    <form class="add-form" id="add-form">
      <input id="new-todo" type="text" placeholder="やることを入力…" autocomplete="off">
      <button type="submit">追加</button>
    </form>

    <div class="filters">
      <button data-filter="all" class="active">すべて</button>
      <button data-filter="active">未完了</button>
      <button data-filter="done">完了</button>
    </div>

    <ul id="todo-list"></ul>

    <div class="footer">
      <span id="count"></span>
      <button id="clear-done">完了したものを削除</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "todo-app-items";

    // 保存されているToDoを読み込む
    function loadTodos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    // ToDoをブラウザに保存する
    function saveTodos() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
      } catch {
        // 保存できない環境では何もしない
      }
    }

    let todos = loadTodos();
    let currentFilter = "all";

    const form = document.getElementById("add-form");
    const input = document.getElementById("new-todo");
    const list = document.getElementById("todo-list");
    const count = document.getElementById("count");

    // 画面を描き直す
    function render() {
      const visible = todos.filter(todo => {
        if (currentFilter === "active") return !todo.done;
        if (currentFilter === "done") return todo.done;
        return true;
      });

      list.innerHTML = "";
      if (visible.length === 0) {
        list.innerHTML = '<li class="empty">ToDoはありません</li>';
      }

      for (const todo of visible) {
        const li = document.createElement("li");
        if (todo.done) li.classList.add("done");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = todo.done;
        checkbox.addEventListener("change", () => {
          todo.done = checkbox.checked;
          saveTodos();
          render();
        });

        const title = document.createElement("span");
        title.className = "title";
        title.textContent = todo.title;

        const del = document.createElement("button");
        del.className = "delete";
        del.textContent = "削除";
        del.addEventListener("click", () => {
          todos = todos.filter(t => t.id !== todo.id);
          saveTodos();
          render();
        });

        li.append(checkbox, title, del);
        list.appendChild(li);
      }

      const remaining = todos.filter(t => !t.done).length;
      count.textContent = `残り ${remaining} 件`;
    }

    // ToDoを追加する
    form.addEventListener("submit", event => {
      event.preventDefault();
      const title = input.value.trim();
      if (!title) return;
      todos.push({ id: Date.now(), title, done: false });
      input.value = "";
      saveTodos();
      render();
    });

    // 絞り込みを切り替える
    document.querySelectorAll(".filters button").forEach(button => {
      button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
        button.classList.add("active");
        render();
      });
    });

    // 完了したToDoをまとめて削除する
    document.getElementById("clear-done").addEventListener("click", () => {
      todos = todos.filter(t => !t.done);
      saveTodos();
      render();
    });

    render();
  </script>
</body>
</html>
